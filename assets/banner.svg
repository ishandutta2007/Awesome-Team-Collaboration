<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card {
        animation: float 6s ease-in-out infinite alternate;
      }
      .float-card-reverse {
        animation: floatReverse 7s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.6; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px); }
        100% { transform: translateY(14px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Animated Background Elements (Behind Foreground Text) -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" class="pulse-circle" style="transform-origin: 150px 80px;" />
  <circle cx="1050" cy="220" r="140" fill="#a855f7" class="pulse-circle" style="transform-origin: 1050px 220px;" />

  <!-- Animated Floating Cards in Background Corners -->
  <g class="float-card">
    <rect x="60" y="160" width="180" height="90" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="90" cy="190" r="12" fill="#38bdf8"/>
    <rect x="110" y="184" width="80" height="12" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="90" y="215" width="120" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  </g>

  <g class="float-card-reverse">
    <rect x="960" y="50" width="180" height="90" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="990" cy="80" r="12" fill="#4ade80"/>
    <rect x="1010" y="74" width="80" height="12" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="990" y="105" width="120" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Foreground Main Content & Title (Ensured visible and unobstructed) -->
  <g text-anchor="middle">
    <!-- Icon / Badge -->
    <rect x="560" y="45" width="80" height="40" rx="20" fill="rgba(99, 102, 241, 0.3)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="600" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#38bdf8" font-weight="bold">🚀 2026</text>

    <!-- Main Title -->
    <text x="600" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="1">
      Awesome Team Collaboration
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#e2e8f0" font-weight="400" letter-spacing="0.5">
      Curated Ecosystem of Open-Source Projects &amp; Enterprise SaaS Platforms
    </text>

    <!-- Feature Tags -->
    <g transform="translate(340, 220)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="75" y="21" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">💬 Team Chat</text>

      <rect x="175" y="0" width="170" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="260" y="21" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">📹 Video Meetings</text>

      <rect x="365" y="0" width="155" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="442" y="21" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">🌐 Data Sovereignty</text>
    </g>
  </g>
</svg>
